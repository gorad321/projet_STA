{% extends "admin/base_admin.html" %}

{% block title %}{% if item %}Modifier{% else %}Ajouter{% endif %} un album — Administration UFR STA{% endblock %}

{% block content %}
<div class="admin-header">
  <h1>{% if item %}Modifier{% else %}Ajouter{% endif %} un album</h1>
</div>

<div class="admin-form-wrapper">
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />

    <div class="form-group">
      <label for="titre">Titre *</label>
      <input type="text" id="titre" name="titre" value="{{ item.titre if item else '' }}" required />
    </div>

    <div class="form-group">
      <label for="date_album">Date</label>
      <input type="date" id="date_album" name="date_album" value="{{ item.date_album.isoformat() if item and item.date_album else '' }}" />
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" name="description" rows="4">{{ item.description if item else '' }}</textarea>
    </div>

    <div class="admin-form-actions">
      <button type="submit" class="btn btn-primary">{% if item %}Enregistrer{% else %}Créer et ajouter des photos{% endif %}</button>
      <a href="{{ url_for('admin_galerie') }}" class="btn btn-outline">Annuler</a>
    </div>
  </form>
</div>
{% endblock %}
