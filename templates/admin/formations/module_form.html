{% extends "admin/base_admin.html" %}

{% block title %}Modifier un module — Administration UFR STA{% endblock %}

{% block content %}
<div class="admin-header">
  <h1>Modifier un module — {{ formation.nom }}</h1>
</div>

<div class="admin-form-wrapper">
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />

    <div class="form-group">
      <label for="semestre">Semestre *</label>
      <input type="text" id="semestre" name="semestre" value="{{ item.semestre }}" required />
    </div>

    <div class="form-group">
      <label for="unite_enseignement">Unité d'enseignement *</label>
      <input type="text" id="unite_enseignement" name="unite_enseignement" value="{{ item.unite_enseignement }}" required />
    </div>

    <div class="form-group">
      <label for="nom_module">Élément constitutif *</label>
      <input type="text" id="nom_module" name="nom_module" value="{{ item.nom_module }}" required />
    </div>

    <div class="form-group">
      <label for="vht">VHT (heures)</label>
      <input type="number" id="vht" name="vht" min="0" value="{{ item.vht if item.vht is not none else '' }}" />
    </div>

    <div class="form-group">
      <label for="credits">Crédits (de l'UE)</label>
      <input type="number" id="credits" name="credits" min="0" value="{{ item.credits if item.credits is not none else '' }}" />
    </div>

    <div class="form-group">
      <label for="coefficient">Coefficient</label>
      <input type="number" id="coefficient" name="coefficient" min="0" value="{{ item.coefficient if item.coefficient is not none else '' }}" />
    </div>

    <div class="form-group">
      <label for="specialisation_id">Spécialisation</label>
      <select id="specialisation_id" name="specialisation_id">
        <option value="">Tronc commun</option>
        {% for spe in specialisations %}
          <option value="{{ spe.id_specialisation }}" {% if item.specialisation_id == spe.id_specialisation %}selected{% endif %}>{{ spe.nom }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="admin-form-actions">
      <button type="submit" class="btn btn-primary">Enregistrer</button>
      <a href="{{ url_for('admin_programme', id_formation=formation.id_formation) }}" class="btn btn-outline">Annuler</a>
    </div>
  </form>
</div>
{% endblock %}
